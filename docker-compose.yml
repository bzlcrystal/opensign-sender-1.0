services:
  opensign-sender:
    build: .
    container_name: opensign-sender
    restart: unless-stopped
    ports:
      - "3100:3000"
    environment:
      NODE_ENV: production
      OPENSIGN_URL: ${OPENSIGN_URL}
      OPENSIGN_APP_ID: ${OPENSIGN_APP_ID:-opensign}
      OPENSIGN_USER_EMAIL: ${OPENSIGN_USER_EMAIL}
      OPENSIGN_USER_PASSWORD: ${OPENSIGN_USER_PASSWORD}
